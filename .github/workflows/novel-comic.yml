name: Build Novel Comic
on:
  push:
    branches: [novel-comic]
    paths: ['novel_comic/**', '.github/workflows/novel-comic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install requests==2.32.5 pillow==11.3.0 py7zr==1.0.0 pyinstaller==6.16.0
      - name: Test installer and comic export
        working-directory: novel_comic
        run: python -m unittest -v test_app
      - name: Package desktop application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NovelComic --collect-all py7zr novel_comic/novel_comic.py
      - name: Check packaged runtime
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\NovelComic.exe" -ArgumentList "--verify-package", "package-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Package failed" }
          if (!(Test-Path "package-test/success.txt")) { throw "Package verification missing" }
          Copy-Item novel_comic/README.txt dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NovelComic-Windows-Setup
          path: |
            dist/NovelComic.exe
            dist/README.txt
          if-no-files-found: error
          retention-days: 30
