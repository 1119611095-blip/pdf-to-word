name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check PDF text and image conversion
        run: python app.py --smoke-test source-test
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PDF-to-Word --collect-all pdf2docx app.py
      - name: Test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\PDF-to-Word.exe" -ArgumentList "--smoke-test", "packaged-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE test failed" }
          if (!(Test-Path "packaged-test/success.txt")) { throw "EXE did not complete conversion" }
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-to-Word-Windows-x64
          path: dist/PDF-to-Word.exe
          if-no-files-found: error
          retention-days: 30
